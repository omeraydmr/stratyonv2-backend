services:
  db:
    image: postgres:16-alpine
    container_name: stratyon-db
    environment:
      POSTGRES_USER: ${DB_USER:-stratyon}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-stratyon}
      POSTGRES_DB: ${DB_NAME:-stratyon}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-stratyon}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: stratyon-backend
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DB_HOST: db

volumes:
  pgdata:
