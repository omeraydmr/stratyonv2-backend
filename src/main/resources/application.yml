server:
  port: 8000

spring:
  application:
    name: stratyon-backend
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:stratyon}
    username: ${DB_USER:stratyon}
    password: ${DB_PASSWORD:stratyon}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

app:
  jwt:
    secret: ${JWT_SECRET:changeme-use-a-256-bit-secret-in-production}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}

  aws:
    region: ${AWS_REGION:us-east-1}
    bucket: ${AWS_S3_BUCKET:stratyon-reports}
    access-key: ${AWS_ACCESS_KEY_ID:}
    secret-key: ${AWS_SECRET_ACCESS_KEY:}

  claude:
    api-key: ${ANTHROPIC_API_KEY:}
    base-url: https://api.anthropic.com
    model: ${CLAUDE_MODEL:claude-opus-4-5}
    max-tokens: ${CLAUDE_MAX_TOKENS:1024}

  google:
    analytics:
      property-id: ${GA4_PROPERTY_ID:}
      service-account-json: ${GA4_SERVICE_ACCOUNT_JSON:}
    ads:
      developer-token: ${GOOGLE_ADS_DEVELOPER_TOKEN:}
      client-id: ${GOOGLE_ADS_CLIENT_ID:}
      client-secret: ${GOOGLE_ADS_CLIENT_SECRET:}
      refresh-token: ${GOOGLE_ADS_REFRESH_TOKEN:}
      customer-id: ${GOOGLE_ADS_CUSTOMER_ID:}

  meta:
    access-token: ${META_ACCESS_TOKEN:}
    ad-account-id: ${META_AD_ACCOUNT_ID:}
    api-version: v20.0
